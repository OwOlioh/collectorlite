[package]
name = "bili-collector"
version = "0.1.0"
description = "Local Bilibili favorite collection manager"
authors = ["local"]
edition = "2021"

[lib]
name = "bili_collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "cookies"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["time", "macros"] }
async-trait = "0.1"
keyring = "3"
md5 = "0.7"
url = "2"
webbrowser = "1"
scraper = "0.20"
sha2 = "0.10"
regex = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

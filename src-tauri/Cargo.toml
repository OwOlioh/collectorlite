[package]
name = "bili-collector"
version = "0.1.0"
description = "Local Bilibili favorite collection manager"
authors = ["local"]
edition = "2021"

[lib]
name = "bili_collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "cookies"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["time", "macros"] }
async-trait = "0.1"
keyring = "3"
md5 = "0.7"
url = "2"
webbrowser = "1"
scraper = "0.20"
sha2 = "0.10"
regex = "1"
futures = "0.3"
rand = "0.8"
tiny_http = "0.12"

[dev-dependencies]
# 仅测试用：#[tokio::test] 需要 rt，主依赖里的 tokio 只开了 time/macros
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# ShellExecuteW：自定义协议（obsidian://）必须走系统路由，webbrowser 在 Windows 只会丢给默认浏览器
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

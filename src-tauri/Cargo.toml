[package]
name = "bili-collector"
version = "1.2.0"
description = "Local Bilibili favorite collection manager"
authors = ["local"]
edition = "2021"

[lib]
name = "bili_collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 速记面板的全局快捷键唤起（本功能唯一新增的插件）
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "cookies"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
# rt：用 spawn_blocking 跑 ShellExecute 那条阻塞路径（首次调用实测 ~310 ms，见 uri.rs 注释）
tokio = { version = "1", features = ["macros", "rt", "time"] }
async-trait = "0.1"
keyring = "3"
md5 = "0.7"
url = "2"
webbrowser = "1"
scraper = "0.20"
sha2 = "0.10"
regex = "1"
futures = "0.3"
rand = "0.8"
base64 = "0.22"
# 网易云 weapi：AES-128-CBC 两层加密 + RSA 无填充
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
num-bigint = "0.4"
num-traits = "0.2"
tiny_http = "0.12"

[dev-dependencies]
# 仅测试用：#[tokio::test] 需要 rt，主依赖里的 tokio 只开了 time/macros
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# 速记面板「是否正在播放」检测：WASAPI 会话状态（IAudioSessionManager2 / IAudioSessionControl2）。
# 版本对齐 Cargo.lock 里已有的 0.61（tauri 传递依赖），避免拉新副本。
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
] }
# ShellExecute 系列：自定义协议（obsidian:// / orpheus://）必须走系统路由，
# webbrowser 在 Windows 只会丢给默认浏览器。
# - ShellExecuteW         打开引抛类协议时会同步等 Shell 收尾（实测 310 ms）
# - ShellExecuteExW+NOASYNC 同样的调用降到 11 ms，用它
# - SHELLEXECUTEINFOW 结构体里带了 HKEY 字段 --> 必须开 Win32_System_Registry，否则编译不过
# - winreg（下方）用于唤起**之前**先查协议有没有注册 —— ShellExecute 的返回值实测不可信
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    # 速记面板要枚举窗口并读进程镜像名（OpenProcess / QueryFullProcessImageNameW）
    "Win32_System_Threading",
    # 速记面板吸附网易云：SetWinEventHook 监听窗口移动/销毁/最小化
    "Win32_UI_Accessibility",
    # DwmGetWindowAttribute(DWMWA_EXTENDED_FRAME_BOUNDS)：取去掉阴影后的真实可见边界
    "Win32_Graphics_Dwm",
] }

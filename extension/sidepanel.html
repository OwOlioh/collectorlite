<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>收藏到「collectorlite」</h1>
        <button id="open-options" type="button" class="link">设置</button>
      </header>

      <div class="seg">
        <button id="tab-collect" type="button" class="on">收藏</button>
        <button id="tab-note" type="button">笔记</button>
      </div>

      <p id="status" class="status" hidden></p>

      <!-- ── 收藏视图 ── -->
      <section id="view-collect" class="view on">
        <label class="field">
          <span class="label">标题</span>
          <input id="title" type="text" placeholder="页面标题" />
        </label>

        <div class="field">
          <span class="label">标签</span>
          <div id="selected" class="chips"></div>
          <input id="tag-input" type="text" placeholder="输入后回车新建标签" autocomplete="off" />
          <div id="pool" class="chips pool"></div>
        </div>

        <button id="save" type="button" class="primary">收藏</button>

        <p id="url" class="url"></p>
      </section>

      <!-- ── 笔记视图 ── -->
      <section id="view-note" class="view">
        <!-- 未收藏：给原因 + 去处，而不是一个灰掉的按钮 -->
        <div id="nb-locked" class="empty">
          <div class="ico">🔒</div>
          <h2>这一页还没收藏</h2>
          <p>笔记挂在收藏条目上，<br />先把它收进来才能开始记录。</p>
          <button id="go-collect" type="button" class="primary">去收藏</button>
        </div>

        <div id="nb-open" class="nb">
          <div class="seg sub">
            <button id="tab-annotate" type="button">批注</button>
            <button id="tab-notebook" type="button" class="on">笔记</button>
          </div>

          <!-- 批注模式：轻量标注，仅存本地，不建 Obsidian 笔记 -->
          <div id="annotate-pane" class="pane" hidden>
            <p class="hint">轻量批注，仅存本地、不会创建 Obsidian 笔记。可加时间戳 / 位置标记，点一下跳回视频对应位置。</p>
            <div class="nb-tools">
              <button id="an-time" type="button">+ 时间戳</button>
              <button id="an-pos" type="button">+ 位置标记</button>
            </div>
            <textarea id="annotation" placeholder="写一小段批注…"></textarea>
            <div class="mk-head">
              <span class="label">标记</span>
              <span id="an-count" class="label"></span>
            </div>
            <div id="an-list" class="mk-list"></div>
            <div class="savebar">
              <span id="an-dot" class="dot"></span>
              <span id="an-text">已保存</span>
            </div>
          </div>

          <!-- 笔记模式：关联到 Obsidian 笔记后才能编辑 -->
          <div id="notebook-pane" class="pane">
            <div id="note-setup" class="empty" hidden>
              <div class="ico">📝</div>
              <h2>还没有对应的 Obsidian 笔记</h2>
              <p>先新建一个，或关联一个已有的笔记文件。</p>
              <div class="acts">
                <button id="nb-create" type="button" class="btn">新建笔记</button>
                <button id="nb-link" type="button" class="btn">关联已有</button>
              </div>
            </div>

            <div id="note-editor">
              <div id="conflict" class="conflict" hidden>
                <b>笔记已在别处被修改</b>
                <p>collectorlite 里保存过一次，直接保存会覆盖那份内容。</p>
                <div class="acts">
                  <button id="cf-overwrite" type="button" class="solid">覆盖保存</button>
                  <button id="cf-reload" type="button">重新加载</button>
                </div>
              </div>

              <div class="nb-tools">
                <button id="mk-time" type="button">+ 时间戳</button>
                <button id="mk-pos" type="button">+ 位置标记</button>
                <button id="mk-preview" type="button" class="right">预览</button>
              </div>

              <textarea id="note" placeholder="记点什么？"></textarea>
              <div id="note-preview" class="nb-preview" hidden></div>

              <div class="mk-head">
                <span class="label">标记</span>
                <span id="mk-count" class="label"></span>
              </div>
              <div id="mk-list" class="mk-list"></div>

              <div class="obs-acts">
                <button id="open-obsidian" type="button" class="primary">在 Obsidian 中打开</button>
                <button id="link-obsidian" type="button" class="btn" title="把这条收藏关联到你指定的笔记文件">关联笔记</button>
                <button id="sync-obsidian" type="button" class="btn" title="不等下一轮轮询，立刻与 Obsidian 同步一次">立即同步</button>
              </div>

              <div id="linked-note" class="linked-note" hidden>
                <span id="linked-path" class="linked-path"></span>
                <button id="unlink-obsidian" type="button" class="ghost">取消关联</button>
              </div>

              <div class="savebar">
                <span id="save-dot" class="dot"></span>
                <span id="save-text">已保存</span>
              </div>
            </div>

            <!-- 关联搜索面板：必须放在 note-editor 之外，否则未关联笔记时
                 note-editor 被 hidden，面板虽 hidden=false 仍不可见，点了像没反应。 -->
            <div id="link-panel" class="link-panel" hidden>
              <div class="link-head">
                <input id="link-search" type="search" placeholder="搜索 vault 里的笔记…" autocomplete="off" />
                <button id="link-close" type="button" class="ghost">关闭</button>
              </div>
              <div id="link-list" class="link-list"></div>
              <div id="link-hint" class="link-hint"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
